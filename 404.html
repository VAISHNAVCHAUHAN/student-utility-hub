<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Utility Hub</title>
</head>
<body>
  <script>
    fetch('/index.html')
      .then(response => response.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.body.innerHTML = '<h1>Page could not be loaded</h1>';
      });
  </script>
</body>
</html>
